<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Checkout - Toko Fathya Wear</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>

<header>
  <h1>Checkout</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="products.html">Products</a>
    <a href="blog.html">Blog</a>
    <a href="contact.html">Contact</a>
    <a href="cart.html">🛒 Cart (<span id="cart-count">0</span>)</a>
  </nav>
</header>

<main>
  <div class="checkout-container">
    <h2>Metode Pembayaran</h2>

    <form onsubmit="processPayment(event)">

      <!-- TRANSFER -->
      <label>
        <input type="radio" name="payment" value="transfer" checked> 🏦 Transfer Bank
      </label>

      <div id="bank-options">
        <label>Pilih Bank:</label>
        <select id="bank-name">
          <option value="BCA">BCA</option>
          <option value="Mandiri">Mandiri</option>
          <option value="BNI">BNI</option>
          <option value="BRI">BRI</option>
        </select>
      </div>

      <!-- E-WALLET -->
      <label>
        <input type="radio" name="payment" value="ewallet"> 📱 E-Wallet
      </label>

      <div id="ewallet-options">
        <label>Pilih E-Wallet:</label>
        <select id="ewallet-name">
          <option value="OVO">OVO</option>
          <option value="Dana">Dana</option>
          <option value="GoPay">GoPay</option>
          <option value="ShopeePay">ShopeePay</option>
        </select>
      </div>

      <!-- COD -->
      <label>
        <input type="radio" name="payment" value="cod"> 🚚 COD
      </label>

      <div id="cod-options">
        <label>Alamat Pengiriman:</label>
        <textarea id="address" rows="3" placeholder="Masukkan alamat lengkap"></textarea>
      </div>

      <p><strong>Total:</strong> Rp <span id="checkout-total">0</span></p>

      <button type="submit">Bayar Sekarang</button>
    </form>
  </div>

  <!-- MODAL -->
  <div id="payment-modal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <p id="payment-message"></p>
      <button onclick="goToConfirmation()">Konfirmasi</button>
    </div>
  </div>
</main>

<footer>
  <p>&copy; 2026 Toko Fathya Wear</p>
</footer>

<script>
// ===== INIT =====
window.onload = () => {
  updateCartIcon();

  const total = parseInt(localStorage.getItem("checkoutTotal")) || 0;
  document.getElementById("checkout-total").textContent =
    total.toLocaleString("id-ID");

  togglePaymentOptions();

  document.querySelectorAll('input[name="payment"]').forEach(radio => {
    radio.addEventListener("change", togglePaymentOptions);
  });
};

// ===== TOGGLE =====
function togglePaymentOptions() {
  const selected = document.querySelector('input[name="payment"]:checked').value;

  document.getElementById("bank-options").style.display =
    selected === "transfer" ? "block" : "none";

  document.getElementById("ewallet-options").style.display =
    selected === "ewallet" ? "block" : "none";

  document.getElementById("cod-options").style.display =
    selected === "cod" ? "block" : "none";
}

// ===== PROSES BAYAR (VALIDASI SAJA) =====
function processPayment(event) {
  event.preventDefault();

  const method = document.querySelector('input[name="payment"]:checked').value;
  const total = parseInt(localStorage.getItem("checkoutTotal")) || 0;

  if (total === 0) {
    showModal("Keranjang masih kosong!");
    return;
  }

  if (method === "cod") {
    const address = document.getElementById("address").value.trim();
    if (!address) {
      showModal("Alamat pengiriman wajib diisi!");
      return;
    }
  }

  // tampilkan modal saja
  let msg = `Total Rp ${total.toLocaleString("id-ID")}<br>`;

  if (method === "transfer") {
    const bank = document.getElementById("bank-name").value;
    msg += `Transfer ke ${bank}`;
  }

  if (method === "ewallet") {
    const wallet = document.getElementById("ewallet-name").value;
    msg += `Bayar via ${wallet}`;
  }

  if (method === "cod") {
    const address = document.getElementById("address").value;
    msg += `COD<br>${address}`;
  }

  showModal(msg);
}

// ===== SIMPAN FINAL (INI KUNCI) =====
function goToConfirmation() {
  const method = document.querySelector('input[name="payment"]:checked').value;

  localStorage.setItem("paymentMethod", method);

  if (method === "transfer") {
    localStorage.setItem("bankName", document.getElementById("bank-name").value);
  }

  if (method === "ewallet") {
    localStorage.setItem("ewalletName", document.getElementById("ewallet-name").value);
  }

  if (method === "cod") {
    localStorage.setItem("codAddress", document.getElementById("address").value);
  }

  closeModal();
  window.location.href = "order-confirmation.html";
}

// ===== MODAL =====
function showModal(msg) {
  document.getElementById("payment-message").innerHTML = msg;
  document.getElementById("payment-modal").style.display = "block";
}

function closeModal() {
  document.getElementById("payment-modal").style.display = "none";
}
</script>

</body>
</html>
