<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keranjang Belanja - Toko Fathya Wear</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Keranjang Belanja</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="products.html">Catalog</a>
    <a href="blog.html">Blog</a>
    <a href="contact.html">Contact</a>
    <a href="cart.html">🛒 Cart (<span id="cart-count">0</span>)</a>
  </nav>
</header>

<main>
  <div class="cart-container">
    <h2>Daftar Belanja Anda</h2>

    <!-- LIST PRODUK -->
    <div id="cart-items"></div>

    <!-- TOTAL -->
    <div class="cart-total">
      Total: Rp <span id="cart-total">0</span>
    </div>

    <!-- CHECKOUT -->
    <button class="checkout-btn" onclick="checkout()">Checkout</button>
  </div>
</main>

<footer>
  <p>&copy; 2026 Toko Fathya Wear</p>
</footer>

<script>
  // ===== FORMAT RUPIAH =====
  function formatRupiah(angka) {
    return angka.toLocaleString("id-ID");
  }

  // ===== GET CART =====
  function getCart() {
    return JSON.parse(localStorage.getItem("cart")) || [];
  }

  // ===== SAVE CART =====
  function saveCart(cart) {
    localStorage.setItem("cart", JSON.stringify(cart));
  }

  // ===== UPDATE ICON CART =====
  function updateCartIcon() {
    let cart = getCart();
    let totalItems = cart.reduce((sum, item) => sum + (item.qty || 1), 0);

    document.getElementById("cart-count").textContent = totalItems;
  }

  // ===== DISPLAY CART =====
  function displayCart() {
    let cart = getCart();
    let cartItems = document.getElementById("cart-items");
    let cartTotal = document.getElementById("cart-total");

    cartItems.innerHTML = "";
    let total = 0;

    // ===== JIKA KOSONG =====
    if (cart.length === 0) {
      cartItems.innerHTML = `
        <div class="empty-cart" style="text-align:center;">
          <p>Keranjang belanja Anda masih kosong</p>
          <a href="products.html" class="btn-empty-cart">Belanja Sekarang</a>
          <a href="promo.html" class="btn-empty-cart">Lihat Promo</a>
          <a href="index.html" class="btn-empty-cart">Kembali ke Beranda</a>
        </div>
      `;
      cartTotal.textContent = "0";
      return;
    }

    // ===== TAMPILKAN ITEM =====
    cart.forEach((item, index) => {
      let qty = item.qty || 1;
      let subtotal = item.price * qty;

      let div = document.createElement("div");
      div.classList.add("cart-item");

      div.innerHTML = `
        <div class="cart-name">
          ${item.name}
          ${item.size ? `<span class="cart-size">(Size: ${item.size})</span>` : ""}
          ${item.color ? `<span class="cart-color">(Warna: ${item.color})</span>` : ""}
        </div>

        <div class="cart-price">
          Rp ${formatRupiah(item.price)}
        </div>

        <div class="cart-qty">
          <button class="qty-btn" onclick="reduceItem(${index})">-</button>
          <span>${qty}</span>
          <button class="qty-btn" onclick="addQty(${index})">+</button>
        </div>

        <button class="delete-btn" onclick="removeItem(${index})">🗑</button>
      `;

      cartItems.appendChild(div);

      total += subtotal;
    });

    cartTotal.textContent = formatRupiah(total);
  }

  // ===== TAMBAH JUMLAH =====
  function addQty(index) {
    let cart = getCart();

    cart[index].qty = (cart[index].qty || 1) + 1;

    saveCart(cart);
    displayCart();
    updateCartIcon();
  }

  // ===== KURANGI JUMLAH =====
  function reduceItem(index) {
    let cart = getCart();

    if ((cart[index].qty || 1) > 1) {
      cart[index].qty--;
    } else {
      cart.splice(index, 1);
    }

    saveCart(cart);
    displayCart();
    updateCartIcon();
  }

  // ===== HAPUS ITEM =====
  function removeItem(index) {
    let cart = getCart();

    cart.splice(index, 1);

    saveCart(cart);
    displayCart();
    updateCartIcon();
  }

  // ===== CHECKOUT =====
  function checkout() {
    let cart = getCart();

    if (cart.length === 0) {
      alert("Keranjang kosong!");
      return;
    }

    let total = cart.reduce((sum, item) => {
      return sum + item.price * (item.qty || 1);
    }, 0);

    localStorage.setItem("checkoutTotal", total);

    window.location.href = "checkout.html";
  }

  // ===== LOAD HALAMAN =====
  window.addEventListener("DOMContentLoaded", function () {
    displayCart();
    updateCartIcon();
  });
</script>

</body>
</html>
